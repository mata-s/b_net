<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#1565c0">
    <meta name="robots" content="noindex,nofollow">
    <title>B-Net チーム招待</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f7fb;
        color: #172033;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(160deg, #e9f2ff 0%, #f8fafc 55%, #fff 100%);
      }
      main {
        width: min(100%, 440px);
        padding: 32px 24px;
        border: 1px solid #dbe5f1;
        border-radius: 24px;
        background: rgba(255, 255, 255, .96);
        box-shadow: 0 18px 50px rgba(36, 72, 120, .12);
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        background: #e3f0ff;
        color: #1565c0;
        font-size: 34px;
      }
      h1 { margin: 0; font-size: 24px; letter-spacing: .02em; }
      p { margin: 14px 0 24px; color: #5d687a; line-height: 1.7; }
      button {
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 14px;
        background: #1565c0;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:active { transform: translateY(1px); }
      .note { margin: 18px 0 0; font-size: 13px; color: #7a8494; }
      #invalid { display: none; color: #b3261e; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">⚾</div>
      <h1>B-Netのチーム招待</h1>
      <p id="message">B-Netアプリを開いて、チームへの参加を続けます。</p>
      <p id="invalid">招待情報を確認できません。URLが途中で切れていないか確認してください。</p>
      <button id="open-app" type="button">B-Netアプリで開く</button>
      <p class="note">アプリが開かない場合は、B-Netをインストールしてからもう一度このページを開いてください。</p>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const button = document.getElementById('open-app');
      const invalid = document.getElementById('invalid');
      const message = document.getElementById('message');

      if (!token || token.length > 200) {
        button.hidden = true;
        message.hidden = true;
        invalid.style.display = 'block';
      } else {
        const appUrl = `bnet://team-invite?token=${encodeURIComponent(token)}`;
        button.addEventListener('click', () => {
          window.location.href = appUrl;
        });
      }
    </script>
  </body>
</html>
